<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/static/styles/style.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico"><!-- icons8.com/icon/hv8N6oMh9nS9/dollar-coin -->
    <title>Register</title>
</head>

<body>
    <div class="container">
        <section class="card">
        <h1 class="mc" style="margin-bottom: 20px">Register to Budgeting™</h1>

        <form action="/register" method="POST" class="income-form">
            <div class="container">
                <label for="username"><b>Username</b></label>
                <input type="text" placeholder="Enter Username" name="username" style="display: block" required>

                <label for="password"><b>Password</b></label>
                <input type="password" placeholder="Enter Password" name="password" style="display: block" required>

                <button type="submit" style="margin-top: 10px; margin-left: 5px" class="blue-button">Register</button>
            </div>

            <div class="container">
                <button type="button" class="cancelbtn blue-button" style="margin-top: 10px; margin-left: 5px" onclick="document.location = '/';">Cancel</button>
                <span class="psw">Forgot <a href="#">password?</a></span>
            </div>
        </form>

        <a style="margin: 10px;" href="{{ url_for('login_route') }}">Already have an account? Log In</a>

        <header class="page-header">
        </section>
    </div>
</body>

</html>
