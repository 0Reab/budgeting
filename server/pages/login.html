<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/static/styles/style.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico"><!-- icons8.com/icon/hv8N6oMh9nS9/dollar-coin -->
    <title>Login</title>
</head>

<body>
    <div class="container">
        <section class="card">

        <h1>Login Page</h1>

        <form action="/login" method="POST">
            <div class="container">
                <label for="username"><b>Username</b></label>
                <input type="text" placeholder="Enter Username" name="username" style="display: block" required>

                <label for="password"><b>Password</b></label>
                <input type="password" placeholder="Enter Password" name="password" style="display: block" required>

                <button type="submit" style="margin-top: 10px">Login</button>
                <label>
                <input type="checkbox" checked="checked" name="remember"> Remember me
                </label>
            </div>

            <div class="container">
                <button type="button" class="cancelbtn" style="margin-top: 10px" onclick="document.location = '/';">Cancel</button>
                <span class="psw">Forgot <a href="#">password?</a></span>
            </div>
        </form>

        <a href="{{ url_for('register_route') }}">Don't have an account? Sign Up</a>

        </section>
    </div>
</body>

</html>
