<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/static/styles/style.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico"><!-- icons8.com/icon/hv8N6oMh9nS9/dollar-coin -->
    <title>Login</title>
</head>

<body>
    <div class="container">
        <section class="card">
        <h1 class="mc fade-in-slow" style="margin-bottom: 20px">Login to Budgeting™</h1>

        <form action="/login" method="POST" class="income-form">
            <div class="container appear-from-right">
                <label for="username"><b>Username</b></label>
                <input type="text" placeholder="Enter Username" name="username" style="display: block" required>

                <label for="password"><b>Password</b></label>
                <input type="password" placeholder="Enter Password" name="password" style="display: block" required>

                <button type="submit" style="margin-top: 10px; margin-left: 5px" class="blue-button">Login</button>
                <label style="display: inline">
                <input type="checkbox" checked="checked" name="remember"> Remember me
                </label>
            </div>

            <div class="container fade-in-slow">
                <button type="button" class="cancelbtn blue-button" style="margin-top: 10px; margin-left: 5px" onclick="document.location = '/';">Cancel</button>
                <span class="psw">Forgot <a href="#">password?</a></span>
            </div>
        </form>

        <a class="fade-in-slow" style="margin: 10px;" href="{{ url_for('register_route') }}">Don't have an account? Sign Up</a>

        {% if msg %}
        <div class="message fade-in scale-in-slow notifiy" style="margin-top: 10px">
            {{ msg }}
        </div>
        {% endif %}

        {% if err %}
        <div class="error fade-in scale-in-slow notify" style="margin-top: 10px;">
            {{ err }}
        </div>
        {% endif %}

        </section>
    </div>
</body>

</html>
